<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEPP CHAT - Realtime Covert Messaging</title>
    
    <!-- Library Kriptografi AES-256 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <!-- Firebase JS SDK V8 Classical CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #0c1317; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(12, 19, 23, 0.95); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #111b21; padding: 25px; border-radius: 10px; border: 1px solid #00a884; width: 340px; color: #e9edef; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .login-box h3 { margin-bottom: 15px; color: #00a884; font-size: 18px; }
        .login-box select, .login-box input { width: 100%; padding: 10px; margin: 8px 0; background: #2a3942; border: 1px solid #3b4a54; border-radius: 6px; color: #fff; font-size: 13px; text-align: center; outline: none; }
        .login-box button { width: 100%; padding: 10px; margin-top: 10px; background: #00a884; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .login-box button:hover { background: #008f70; }
        
        .app-container { width: 100%; max-width: 900px; height: 92vh; background: #111b21; border-radius: 8px; display: flex; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); filter: blur(4px); pointer-events: none; transition: filter 0.3s; }
        .app-container.active { filter: none; pointer-events: auto; }
        
        .sidebar { width: 35%; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { background: #202c33; padding: 14px 16px; color: #e9edef; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 16px; border-bottom: 1px solid #222d34; display: flex; align-items: center; color: #e9edef; background: #202c33; }
        .avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; }

        .main-chat { width: 65%; display: flex; flex-direction: column; background: #0b141a; }
        .chat-header { background: #202c33; padding: 12px 16px; color: #e9edef; font-size: 13px; border-bottom: 1px solid #222d34; display: flex; justify-content: space-between; align-items: center; }
        .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 20px 20px; }
        
        .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #e9edef; word-wrap: break-word; }
        .bubble-me { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .bubble-them { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .status-online { font-size: 11px; color: #00a884; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        .input-panel { background: #202c33; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #222d34; }
        .input-row { display: flex; gap: 8px; }
        .input-panel input { background: #2a3942; border: 1px solid #3b4a54; padding: 8px 12px; border-radius: 6px; color: #e9edef; font-size: 12px; outline: none; }
        .btn-send { background: #00a884; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-send:hover { background: #008f70; }
        .label-text { font-size: 10px; color: #8696a0; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="login-overlay" id="loginModal">
    <div class="login-box">
        <h3>Zepp Chat - Firebase Sync</h3>
        <p style="font-size: 11px; color: #8696a0; margin-bottom: 12px;">Pilih Identitas Akun Pengguna</p>
        
        <select id="login-role">
            <option value="1574096976">Joe (ID: 1574096976)</option>
            <option value="1998310501">User 2 / Bayu (ID: 1998310501)</option>
        </select>
        
        <input type="password" id="login-pin" placeholder="Masukkan PIN Akses (1111)">
        <button onclick="autentikasiUser()">Masuk Sesi Realtime</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Zepp Chat</span>
            <button class="btn-clear" onclick="hapusDatabaseChat()">Hapus Chat</button>
        </div>
        <div class="chat-list">
            <div class="chat-item">
                <div class="avatar" id="user-avatar">--</div>
                <div>
                    <div style="font-weight: bold; font-size: 14px;" id="user-display-name">Profile...</div>
                    <div style="font-size: 11px; color: #00a884;" id="chat-status">Firebase Connected</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div>
                <strong>Komunikasi Realtime (Firebase + AES-256)</strong>
                <div style="font-size: 10px; color: #8696a0;" id="target-info-header">Target Node: -</div>
            </div>
            <span class="status-online">● Firebase Active</span>
        </div>

        <div class="messages-area" id="msg-container"></div>

        <div class="input-panel">
            <div class="input-row">
                <div style="width: 35%;">
                    <div class="label-text">Tujuan ID:</div>
                    <input type="text" id="target-id" readonly style="width: 100%; opacity: 0.7; background: #182229;">
                </div>
                <div style="width: 65%;">
                    <div class="label-text">Pesan Umpan (Tampak di Telegram Bot):</div>
                    <input type="text" id="decoy-msg" value="besok rapat jam 8" style="width: 100%;">
                </div>
            </div>

            <div>
                <div class="label-text">Pesan Rahasia Asli (AES-256 Steganografi):</div>
                <div class="input-row">
                    <input type="text" id="secret-msg" placeholder="Ketik pesan rahasia di sini..." style="flex: 1;" onkeypress="handleEnter(event)">
                    <button class="btn-send" onclick="sendCovertMessage()">Kirim Realtime</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Konfigurasi Firebase zepp-chatt
    const firebaseConfig = {
        apiKey: "AIzaSyAXI-2th66TkDQ5b5HQjNOr6ahSDzG3Dgs",
        authDomain: "zepp-chatt.firebaseapp.com",
        databaseURL: "https://zepp-chatt-default-rtdb.firebaseio.com",
        projectId: "zepp-chatt",
        storageBucket: "zepp-chatt.firebasestorage.app",
        messagingSenderId: "44690142015",
        appId: "1:44690142015:web:29bb7709ec8bb707f0998a"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const BOT_TOKEN = "8807442602:AAEGfZgvFU4ClbOpmzsOpGxbEFLt9945qLc"; 
    const SECRET_KEY_AES = "ZeppChatSecretKey2026";
    
    let currentUserId = "";
    let currentUserName = "";
    let targetUserId = "";
    let targetUserName = "";

    function autentikasiUser() {
        const selectedId = document.getElementById('login-role').value;
        const inputPin = document.getElementById('login-pin').value.trim();

        if (inputPin === "1111") {
            currentUserId = selectedId;
            
            if (currentUserId === "1574096976") {
                currentUserName = "Joe";
                targetUserId = "1998310501";
                targetUserName = "Bayu";
            } else {
                currentUserName = "Bayu";
                targetUserId = "1574096976";
                targetUserName = "Joe";
            }

            document.getElementById('user-avatar').innerText = currentUserName === "Joe" ? "JO" : "BY";
            document.getElementById('user-display-name').innerText = `${currentUserName} (${currentUserId})`;
            document.getElementById('target-id').value = targetUserId;
            document.getElementById('target-info-header').innerText = `Target Node: ${targetUserName} (${targetUserId})`;

            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').classList.add('active');

            listenRealtimeMessages();
        } else {
            alert("PIN Akses Salah! Gunakan PIN: 1111");
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendCovertMessage();
    }

    function textToZeroWidth(text) {
        return text.split('').map(char => {
            const binary = char.charCodeAt(0).toString(2).padStart(8, '0');
            return binary.split('').map(bit => bit === '1' ? '\u200B' : '\u200C').join('');
        }).join('\u200D');
    }

    // Read Realtime Database Firebase
    function listenRealtimeMessages() {
        const chatRef = database.ref('chats');

        chatRef.on('value', (snapshot) => {
            const container = document.getElementById('msg-container');
            container.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                container.innerHTML = `<div class="bubble bubble-them">Sesi terhubung secara realtime via Firebase. Mulai kirim pesan rahasia!</div>`;
                return;
            }

            Object.values(data).forEach(item => {
                if ((item.senderId === currentUserId && item.receiverId === targetUserId) ||
                    (item.senderId === targetUserId && item.receiverId === currentUserId)) {
                    
                    const bubble = document.createElement('div');
                    
                    if (item.senderId === currentUserId) {
                        bubble.className = 'bubble bubble-me';
                        bubble.innerHTML = `<div style="font-size:10px; color:#aebac1; margin-bottom:2px;">🔒 Terkirim ke ${targetUserName}</div>${item.secretMessage}`;
                    } else {
                        bubble.className = 'bubble bubble-them';
                        bubble.innerHTML = `<strong style="font-size: 10px; color: #00a884;">${item.senderName}</strong><br>${item.secretMessage}`;
                    }
                    
                    container.appendChild(bubble);
                }
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    // Kirim pesan ke Database dan Meneruskan Kamuflase ke Telegram 2 Sisi
    async function sendCovertMessage() {
        const decoyText = document.getElementById('decoy-msg').value;
        const secretText = document.getElementById('secret-msg').value;

        if (!secretText) {
            alert("Pesan Rahasia Wajib Diisi!");
            return;
        }

        const ciphertext = CryptoJS.AES.encrypt(secretText, SECRET_KEY_AES).toString();
        const hiddenPayload = textToZeroWidth(ciphertext);
        const payloadTelegram = decoyText + hiddenPayload;

        // 1. Simpan pesan rahasia ke Firebase Realtime Database
        const newChatRef = database.ref('chats').push();
        await newChatRef.set({
            senderId: currentUserId,
            senderName: currentUserName,
            receiverId: targetUserId,
            secretMessage: secretText,
            timestamp: Date.now()
        });

        document.getElementById('secret-msg').value = '';

        // 2. Teruskan pesan kamuflase ke Telegram Penerima (Misal: Bayu)
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: targetUserId, text: payloadTelegram })
            });
        } catch (err) {
            console.log("Pesan Telegram penerima gagal dikirim.");
        }

        // 3. Teruskan pesan kamuflase ke Telegram Pengirim (Misal: Jo Kurn) sebagai log kirim bot
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: currentUserId, text: payloadTelegram })
            });
        } catch (err) {
            console.log("Pesan Telegram pengirim gagal dikirim.");
        }
    }

    function hapusDatabaseChat() {
        if (confirm("Hapus seluruh riwayat chat di Firebase Database?")) {
            database.ref('chats').remove();
        }
    }
</script>

</body>
</html>
